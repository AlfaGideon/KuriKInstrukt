name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/KuriK-Instrukt.apk
          ls -lh dist

      - name: Publish APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/KuriK-Instrukt.apk
          if git diff --cached --quiet; then
            echo "APK не изменился"
            exit 0
          fi
          git commit -m "build: собран APK KuriK-Instrukt [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: KuriK-Instrukt-apk
          path: dist/KuriK-Instrukt.apk
          if-no-files-found: error

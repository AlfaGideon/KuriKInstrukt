name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/KuriK-Instrukt.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: KuriK-Instrukt-apk
          path: dist/KuriK-Instrukt.apk
          if-no-files-found: error
